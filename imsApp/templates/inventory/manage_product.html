{% load customfilter %}

<div class="container-fluid product-modal-wrapper">
    <div class="product-card">
        <div class="product-header">
            <h4><i class="fa fa-box me-2"></i>Product Details</h4>
        </div>

        <div class="p-3">
            <form action="" id="product-form" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="hidden" name="id" value="{{ product.id }}">

                <div class="form-group mb-3">
                    <label for="category" class="control-label">Category</label>
                    <select name="category" id="category" class="form-select" required>
                        <option value="">-- Select Category --</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}"
                                {% if product.category and product.category.id == cat.id %}selected{% endif %}>
                                {{ cat.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="code" class="control-label">Product Code</label>
                    <input type="text"
                           class="form-control"
                           id="code"
                           name="code"
                           value="{{ product.code }}"
                           required>
                </div>

                <div class="form-group mb-3">
                    <label for="name" class="control-label">Product Name</label>
                    <input type="text"
                           class="form-control"
                           id="name"
                           name="name"
                           value="{{ product.name }}"
                           required>
                </div>

                <div class="form-group mb-3">
                    <label for="description" class="control-label">Description</label>
                    <textarea class="form-control"
                              name="description"
                              id="description"
                              rows="5"
                              required>{{ product.description }}</textarea>
                </div>

                <div class="form-group mb-3">
                    <label for="price" class="control-label">Price</label>
                    <input type="number"
                           step="any"
                           class="form-control text-end"
                           id="price"
                           name="price"
                           value="{{ product.price }}"
                           required>
                </div>

                <div class="form-group mb-3">
                    <label for="image" class="control-label">Product Image</label>
                    <input type="file"
                           class="form-control"
                           name="image"
                           id="image"
                           accept="image/*">

                    {% if product.image %}
                    <div class="mt-2 product-image-preview">
                        <img src="{{ product.image.url }}"
                             alt="Product Image"
                             class="img-fluid product-preview-img">
                    </div>
                    {% endif %}
                </div>

                <div class="form-group mb-0">
                    <label for="status" class="control-label">Status</label>
                    <select name="status" id="status" class="form-select">
                        <option value="1" {% if not product.status or product.status == '1' %}selected{% endif %}>
                            Active
                        </option>
                        <option value="2" {% if product.status == '2' %}selected{% endif %}>
                            Inactive
                        </option>
                    </select>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    $(function() {
        $('#product-form').submit(function(e) {
            e.preventDefault();

            var _this = $(this);
            $('.err-msg').remove();

            var el = $('<div>');
            el.addClass("alert alert-danger err-msg");
            el.hide();

            if (_this[0].checkValidity() === false) {
                _this[0].reportValidity();
                return false;
            }

            start_loader();

            $.ajax({
                url: "{% url 'save-product' %}",
                data: new FormData(_this[0]),
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                dataType: 'json',

                error: function(err) {
                    console.log(err);
                    el.text("An error occurred.");
                    _this.prepend(el);
                    el.show('slow');
                    end_loader();
                },

                success: function(resp) {
                    if (resp.status === 'success') {
                        location.reload();
                    } else if (resp.status === 'failed' && resp.msg) {
                        el.html(resp.msg);
                        _this.prepend(el);
                        el.show('slow');
                    } else {
                        el.text("An error occurred.");
                        _this.prepend(el);
                        el.show('slow');
                        console.error(resp);
                    }

                    $("html, body, .modal").scrollTop(0);
                    end_loader();
                }
            });
        });
    });
</script>
